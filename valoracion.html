<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BESOUL · Valoración</title>
  <link rel="manifest" href="./manifest.json?v=pwa-centros-qr1">
  <meta name="theme-color" content="#0B0F17">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BESOUL">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
  <style>
    body { font-family:'Inter',sans-serif; background:#0B0F17; }
    input, select, textarea { font-size:16px; }
    .bg-hero { background: radial-gradient(circle at top left, rgba(245,158,11,.18), transparent 35%), radial-gradient(circle at bottom right, rgba(34,211,238,.12), transparent 35%), #0B0F17; }
  </style>
</head>
<body class="min-h-screen text-white bg-hero">
  <main class="min-h-screen flex items-center justify-center p-4">
    <section class="w-full max-w-3xl bg-slate-900/95 border border-slate-800 rounded-3xl shadow-2xl overflow-hidden">
      <div class="p-6 md:p-8 border-b border-slate-800 bg-slate-950/50">
        <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-5">
          <div class="flex items-center gap-4">
            <div class="bg-white rounded-xl p-2 w-28 border border-slate-700 shadow-md text-center">
              <div class="text-amber-500 font-extrabold text-xl tracking-tighter italic font-serif">besoul</div>
              <div class="text-slate-950 font-black text-[9px] tracking-[0.25em] border-t border-slate-950 mt-0.5">FIT</div>
            </div>
            <div>
              <p id="campaign-label" class="text-[11px] uppercase tracking-[0.2em] text-amber-400 font-black">Valoración</p>
              <h1 class="text-2xl md:text-3xl font-black leading-tight">Solicita tu valoración inicial</h1>
              <p class="text-sm text-slate-400 mt-1">Elige tu centro preferido y el equipo BESOUL se pondrá en contacto contigo para valorar tu caso.</p>
            </div>
          </div>
          <div class="bg-amber-500 text-slate-950 rounded-2xl px-4 py-3 text-center font-black shadow-lg">
            <div class="text-2xl leading-none">45'</div>
            <div class="text-[10px] uppercase tracking-wider">valoración</div>
          </div>
        </div>
      </div>

      <form id="trial-form" class="p-6 md:p-8 space-y-5" novalidate>
        <input type="text" id="lead-empresa" class="hidden" tabindex="-1" autocomplete="off">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div>
            <label for="nombre" class="text-xs font-bold text-slate-300 block mb-1">Nombre y apellidos *</label>
            <input id="nombre" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-3 text-white focus:outline-none focus:ring-2 focus:ring-amber-500" placeholder="Tu nombre">
          </div>
          <div>
            <label for="telefono" class="text-xs font-bold text-slate-300 block mb-1">Teléfono *</label>
            <input id="telefono" required inputmode="tel" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-3 text-white focus:outline-none focus:ring-2 focus:ring-amber-500" placeholder="WhatsApp / teléfono">
          </div>
          <div>
            <label for="email" class="text-xs font-bold text-slate-300 block mb-1">Email *</label>
            <input id="email" required type="email" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-3 text-white focus:outline-none focus:ring-2 focus:ring-amber-500" placeholder="tu@email.com">
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div>
            <label for="centro" class="text-xs font-bold text-slate-300 block mb-1">Centro preferido *</label>
            <select id="centro" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-3 text-white focus:outline-none focus:ring-2 focus:ring-amber-500"></select>
          </div>
          <div>
            <label for="objetivo" class="text-xs font-bold text-slate-300 block mb-1">Objetivo principal</label>
            <select id="objetivo" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-3 text-white focus:outline-none focus:ring-2 focus:ring-amber-500">
              <option value="">Selecciona objetivo</option>
              <option>Pérdida de peso</option>
              <option>Fuerza</option>
              <option>Salud</option>
              <option>Dolor / lesión</option>
              <option>Rendimiento</option>
              <option>Estética</option>
              <option>Bienestar general</option>
              <option>Otro</option>
            </select>
          </div>
          <div>
            <label for="horario" class="text-xs font-bold text-slate-300 block mb-1">Horario preferido</label>
            <select id="horario" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-3 text-white focus:outline-none focus:ring-2 focus:ring-amber-500">
              <option value="">Sin preferencia</option>
              <option>Mañana</option>
              <option>Mediodía</option>
              <option>Tarde</option>
              <option>Noche</option>
              <option>Flexible</option>
            </select>
          </div>
        </div>

        <div>
          <label for="observaciones" class="text-xs font-bold text-slate-300 block mb-1">Observaciones / lesiones / disponibilidad</label>
          <textarea id="observaciones" rows="4" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-3 text-white focus:outline-none focus:ring-2 focus:ring-amber-500" placeholder="Cuéntanos brevemente si tienes alguna lesión, limitación, preferencia de intensidad o disponibilidad concreta."></textarea>
        </div>

        <label class="flex gap-3 items-start bg-slate-950 border border-slate-800 rounded-xl p-4 text-sm text-slate-300">
          <input id="privacidad" type="checkbox" class="mt-1 accent-amber-500" required>
          <span>Acepto que BESOUL utilice estos datos para contactar conmigo y gestionar mi solicitud de valoración inicial.</span>
        </label>

        <div id="form-msg" class="hidden rounded-xl border p-4 text-sm"></div>

        <button id="btn-submit" type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-black py-4 rounded-2xl transition uppercase tracking-wider">Solicitar valoración</button>

        <p class="text-[11px] text-slate-500 text-center leading-relaxed">Solicitud sin compromiso. La valoración queda pendiente de confirmación por parte del equipo BESOUL.</p>
      </form>
    </section>
  </main>

<script>
const BS_FIREBASE_CONFIG = {
  apiKey: "AIzaSyAHp7l39BYkgHTVNNwPaaa21tTksBQ94Zo",
  authDomain: "besoul-suite.firebaseapp.com",
  projectId: "besoul-suite",
  storageBucket: "besoul-suite.firebasestorage.app",
  messagingSenderId: "215142605598",
  appId: "1:215142605598:web:943629a7a9c50c034a1f0f"
};

const CENTROS_FALLBACK = [
  { id:'alfa_prime', nombre:'Alfa Prime', orden:1, visibleQR:true, activo:true },
  { id:'fantasy', nombre:'Fantasy', orden:2, visibleQR:true, activo:true },
  { id:'inacua', nombre:'Inacua', orden:3, visibleQR:true, activo:true },
  { id:'lagunillas', nombre:'Lagunillas', orden:4, visibleQR:true, activo:true }
];
const OBJETIVOS_VALIDOS = ['','Pérdida de peso','Fuerza','Salud','Dolor / lesión','Rendimiento','Estética','Bienestar general','Otro'];
const HORARIOS_VALIDOS = ['','Mañana','Mediodía','Tarde','Noche','Flexible'];
let db = null;
let centrosDisponibles = [...CENTROS_FALLBACK];

function qs(name){ return new URLSearchParams(window.location.search).get(name) || ''; }
function limpiar(v){ return String(v || '').trim(); }
function slug(v){ return limpiar(v).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,''); }
function escapeHTML(v){ return String(v || '').replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[ch])); }
function normalizarCentroId(v){
  const raw = limpiar(v);
  if (!raw) return '';
  const s = slug(raw);
  const match = centrosDisponibles.find(c => c.id === raw || c.id === s || slug(c.nombre) === s);
  return match ? match.id : s;
}
function centroNombre(id){ return centrosDisponibles.find(c => c.id === id)?.nombre || id; }
function campañaActual(){ return limpiar(qs('campana') || qs('campaña') || qs('utm_campaign') || qs('medio') || 'qr_prueba_gratis'); }
function fuenteActual(){ return limpiar(qs('src') || qs('utm_source') || 'qr'); }
function mostrarMensaje(tipo, texto){
  const el = document.getElementById('form-msg');
  el.className = tipo === 'ok'
    ? 'rounded-xl border p-4 text-sm bg-emerald-500/10 border-emerald-500/30 text-emerald-200'
    : 'rounded-xl border p-4 text-sm bg-red-500/10 border-red-500/30 text-red-200';
  el.innerHTML = texto;
  el.classList.remove('hidden');
  el.scrollIntoView({behavior:'smooth', block:'center'});
}
function pintarCentros(){
  const select = document.getElementById('centro');
  const centroParam = normalizarCentroId(qs('centro') || qs('center'));
  const visibles = centrosDisponibles.filter(c => c.activo !== false && c.visibleQR !== false);
  select.innerHTML = '<option value="">Selecciona centro</option>' + visibles.map(c => `<option value="${escapeHTML(c.id)}">${escapeHTML(c.nombre)}</option>`).join('');
  if (centroParam && visibles.some(c => c.id === centroParam)) select.value = centroParam;
}
async function cargarCentros(){
  try {
    const snap = await db.collection('besoulPublicConfig').doc('centros').get();
    if (snap.exists && Array.isArray(snap.data().centros) && snap.data().centros.length) {
      centrosDisponibles = snap.data().centros
        .filter(c => c && c.activo !== false && c.visibleQR !== false)
        .map(c => ({ id:limpiar(c.id), nombre:limpiar(c.nombre), orden:Number(c.orden ?? 99), activo:c.activo !== false, visibleQR:c.visibleQR !== false }))
        .filter(c => c.id && c.nombre)
        .sort((a,b) => (a.orden - b.orden) || a.nombre.localeCompare(b.nombre,'es'));
    }
  } catch (err) {
    console.warn('No se pudieron cargar centros públicos. Uso fallback.', err);
  }
  pintarCentros();
}
function validarFormulario(){
  const nombre = limpiar(document.getElementById('nombre').value);
  const telefono = limpiar(document.getElementById('telefono').value);
  const email = limpiar(document.getElementById('email').value).toLowerCase();
  const centroId = normalizarCentroId(document.getElementById('centro').value);
  if (!nombre || nombre.length < 2) throw new Error('Introduce tu nombre y apellidos.');
  if (!telefono || telefono.length < 6) throw new Error('Introduce un teléfono válido.');
  if (!email || !/^\S+@\S+\.\S+$/.test(email)) throw new Error('Introduce un email válido.');
  if (!centroId) throw new Error('Selecciona un centro preferido.');
  if (!document.getElementById('privacidad').checked) throw new Error('Debes aceptar el tratamiento de datos para gestionar la solicitud.');
  const objetivo = document.getElementById('objetivo').value;
  const horario = document.getElementById('horario').value;
  return {
    nombre,
    telefono,
    email,
    centroId,
    centroNombre: centroNombre(centroId),
    estado: 'Prueba solicitada',
    fuente: 'QR valoración',
    medioCaptacion: campañaActual(),
    captadorNombre: 'QR / formulario público',
    trainerKey: '',
    trainerName: '',
    objetivo: OBJETIVOS_VALIDOS.includes(objetivo) ? objetivo : '',
    horarioPreferido: HORARIOS_VALIDOS.includes(horario) ? horario : '',
    tipoPrueba: 'Valoración inicial',
    duracionPrueba: '45 min',
    notas: '',
    notaEntrenadorPrueba: limpiar(document.getElementById('observaciones').value).slice(0, 1200),
    createdAt: new Date().toISOString(),
    updatedAt: new Date().toISOString(),
    createdByEmail: 'formulario-publico@besoul',
    createdByName: 'Formulario QR público',
    updatedByEmail: 'formulario-publico@besoul',
    updatedByName: 'Formulario QR público',
    convertido: false,
    origenPublico: (window.location.pathname.split('/').pop() || 'valoracion.html'),
    origenQR: true,
    sourceParam: fuenteActual(),
    campana: campañaActual()
  };
}
async function enviarSolicitud(evt){
  evt.preventDefault();
  const btn = document.getElementById('btn-submit');
  if (document.getElementById('lead-empresa').value) { mostrarMensaje('ok','Solicitud recibida. Gracias.'); return; }
  try {
    const data = validarFormulario();
    btn.disabled = true;
    btn.innerText = 'Enviando solicitud...';
    await db.collection('besoulLeads').add(data);
    document.getElementById('trial-form').reset();
    pintarCentros();
    mostrarMensaje('ok', `<b>Solicitud recibida.</b><br>Gracias, ${escapeHTML(data.nombre)}. El equipo BESOUL contactará contigo para confirmar tu prueba en ${escapeHTML(data.centroNombre)}.`);
  } catch (err) {
    console.error(err);
    mostrarMensaje('error', escapeHTML(err.message || 'No se ha podido enviar la solicitud. Inténtalo de nuevo.'));
  } finally {
    btn.disabled = false;
    btn.innerText = 'Solicitar valoración';
  }
}
function inicializar(){
  if (!firebase.apps.length) firebase.initializeApp(BS_FIREBASE_CONFIG);
  db = firebase.firestore();
  const camp = campañaActual();
  if (camp && camp !== 'qr_valoracion') document.getElementById('campaign-label').innerText = `Valoración · ${camp.replace(/_/g,' ')}`;
  cargarCentros();
  document.getElementById('trial-form').addEventListener('submit', enviarSolicitud);
}
window.addEventListener('DOMContentLoaded', inicializar);
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
  }
</script>
</body>
</html>
